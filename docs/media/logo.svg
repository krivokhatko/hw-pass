        <g class="pupil"><circle cx="3" cy="5" r="12" fill="#1B1B1B"/><circle cx="-1" cy="0" r="4.5" fill="#FFFFFF"/></g>
      </g></g>
    </g>
    <ellipse cx="-54" cy="-12" rx="11" ry="7" fill="#FF7A59" opacity="0.7"/>
    <ellipse cx="54" cy="-12" rx="11" ry="7" fill="#FF7A59" opacity="0.7"/>
    <path class="mouth" d="M -30 -4 Q 0 28 30 -4" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>
      
    </g>

