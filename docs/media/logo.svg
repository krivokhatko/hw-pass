      <path d="M 90 40 C 128 40 148 10 152 -14" fill="none" stroke="#F3811A" stroke-width="12" stroke-linecap="round"/>
      <g transform="translate(154 -72)">
  <g class="key" transform="scale(1.15)">
    <rect x="-8" y="10" width="16" height="92" rx="5" fill="#FFD166" stroke="#2B1D0E" stroke-width="6"/>
