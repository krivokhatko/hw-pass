    <circle cx="0" cy="-2" r="7" fill="#2B1D0E"/>
  </g></g>
      <circle cx="154" cy="-16" r="18" fill="#FF9F1C" stroke="#2B1D0E" stroke-width="7"/>
      <g class="sparkle"><path d="M 200 -117 L 203.52 -109.52 L 211 -106 L 203.52 -102.48 L 200 -95 L 196.48 -102.48 L 189 -106 L 196.48 -109.52 Z" fill="#FFB000"/><path d="M 122 -119 L 124.24 -114.24 L 129 -112 L 124.24 -109.76 L 122 -105 L 119.76 -109.76 L 115 -112 L 119.76 -114.24 Z" fill="#FFB000"/><path d="M 210 -50 L 211.92 -45.92 L 216 -44 L 211.92 -42.08 L 210 -38 L 208.08 -42.08 L 204 -44 L 208.08 -45.92 Z" fill="#FFB000"/></g>
    </g>

